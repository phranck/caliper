# The design values, and the only place they are written.
#
# From here `tools/generate_tokens.py` writes the C++ header the device uses and
# the Python module the papers are drawn from. Neither output is ever edited by
# hand, so the two cannot disagree with each other or with this file.
#
# Spacings are millimetres rather than points. A margin answers to an eye and a
# finger, so on a denser panel it should look the same rather than occupy the
# same number of pixels. Points appear nowhere in this file; they are what comes
# out of it once a panel is known.

[spacing]
edge = "2.18 mm"      # the screen's edge to anything inside it
group = "3.27 mm"     # two groups side by side, such as a cover and its text
inset = "2.72 mm"     # a surface's own edge to its content
line_gap = "1.63 mm"  # two lines that belong together

# The status bar keeps its own, smaller margin. It is 32 points tall where the
# screen is 480, so the screen's own margin would be coarse there and pull the
# bar apart. A menu bar behaves the same way for the same reason.
# How far a floating thing stands off whatever is around it. The player pill
# holds it against the sidebar, the right edge and the bottom edge alike, which
# is what makes it read as lying over the screen rather than fixed to it.
floating = "1.09 mm"

# The air inside the player pill, above and below what stands in it. It sets
# the pill's height and therefore the curve of its ends as well.
player_inset = "1.09 mm"

status_edge = "1.09 mm"

# Between two things in the status_bar. Wider than the bar's own edge, so that
# each of them is read on its own rather than as one run of characters.
status_gap = "2.18 mm"

[touch]
# What a hand needs, and the floor the checks measure against. These are the
# only two values in this file that come from a body rather than from a design,
# which is why they are the two that never change with the panel.
fingertip = "9.0 mm"
thumb = "12.0 mm"

# The floor the checks measure a control against, which is not the same as a
# fingertip. A fingertip is how wide a finger is, and it decides a key of a
# keyboard, where targets sit side by side and a miss lands on the neighbour. A
# button in a bar is wide and stands alone, so it is hit reliably at less than
# that. Where a control has to carry the full fingertip, it says so itself.
minimum = "6.53 mm"

[type]
# The scale is a rule, not a collection. Every grade is the cap height seen
# under one angle, so a grade that drifts out of the set shows up rather than
# settling in.
#
# The angle is the one the panel's own scale was drawn at, and the reading
# distances are what each grade is meant to be legible from. Both together
# produce the four grades the interface uses today, to the point.
cap_angle_mrad = 6.1

# How much of a type size its capitals occupy, and where the rest of the letter
# sits. Measured from the files under assets/fonts.
#
# The cap height and the descender are the same in all four cuts of Barlow Semi
# Condensed. The x-height is not: it runs from 0.5060 in Regular to 0.5140 in
# Bold, and the figure here is the Regular one, because that is what body text
# is set in and what the fit checks measure against.
cap_ratio = 0.7000
x_height_ratio = 0.5060
descender_ratio = 0.2000

# Computed back from the four grades the interface uses, so the rule reproduces
# the scale to the point. A change of typeface changes the cap ratio and moves
# these with it.
title = "935 mm"
heading = "560 mm"
body = "405 mm"
small = "345 mm"

# The status bar has its own grade, smaller than the smallest of the others. It
# is read at a glance from further back than a line of body text, and it is the
# one place on the screen where a grade may sit outside the reading scale
# because nothing there is read line by line.
status = "265 mm"

# The name under a sidebar symbol, which is the smallest grade of the scale. It
# is this small because the longest of the four words has to sit inside an item:
# "Einstellungen" needs 74.5 points at 14 and has 80 less its padding.
caption = "203 mm"

[layout]
# The heights of the three bands. They are in millimetres like every other
# physical size, so a denser panel keeps a status bar of the same apparent
# height rather than one half as tall.
#
# A band is meant to take its height from what it holds. These are what the
# design draws today, and they are here so that a screen built from components
# lands on the drawing rather than near it. Where a band computes its own height
# later, this is the figure it has to arrive at.
status_bar = "4.35 mm"
header = "9.25 mm"
footer = "10.88 mm"

# How tall a button is drawn. Less than a fingertip, because a bar of buttons at
# full finger height eats the screen, and what a finger needs is the area it can
# be hit in rather than the area that is painted. The two are set apart, so the
# touch target stays 9 mm whilst the button looks like this.
button = "6.53 mm"

# A key of the player. The pill takes its height from this and the air around
# it, so the shape of its ends follows whenever either moves.
media_key = "6.80 mm"

# The sidebar and one item in it. It is as wide as the wordmark in the
# status_bar plus eight points on either side, because the two stand one above
# the other and an edge a few points out is seen at once. An item is square and
# holds a symbol with its name beneath, so it is as tall as it is wide less the
# eight points the sidebar keeps at its own edges.
sidebar = "11.97 mm"
sidebar_item = "10.88 mm"

[grid]
# Nothing lands between two of these. Half a point is invisible on its own and
# plainly visible the moment two surfaces sit side by side, which is why this is
# a whole number of pixels rather than a millimetre: it exists to keep edges
# from disagreeing, not to look the same on every panel.
unit = 2

[radius]
# Only the outer corners are stated. A corner inside another is computed from
# the one around it, because writing the two as separate numbers produces a
# pinched corner the first time either moves.
panel = "4.35 mm"    # the largest surface, such as a dialog or a card
tile = "2.18 mm"     # a tile, a button, a key
artwork = "1.63 mm"  # a cover, which brings a corner of its own

# A button's own corner. It is not the tile's: a tile is 68 points tall and a
# button 48, and the same radius on the shorter one comes within a few points of
# a pill. The corner follows the height rather than being shared with it.
button = "1.63 mm"

# The exponent of the superellipse. At 4.5 the shape is hard to tell from a
# rounded rectangle; at 3.2 the curve runs visibly into the flanks, which is
# what makes a squircle one.
squircle = 3.2

# A squircle rounds in proportion to its size and a radius does not, so the
# exponent that suits a button of 60 points eats a quarter of the edge of a
# cover of 200. Artwork therefore gets its own, higher one.
squircle_artwork = 8.0

[colour]
# A colour has no measurement, so these pass through untouched.
#
# Greys rather than browns, and neutral greys: red, green and blue are equal in
# every one of them. A dark interface with a cast in its grounds reads as a
# colour somebody chose, and here the only colour anybody chose is the accent.
# That is what makes it the one thing on a screen that can be acted on.
#
# The steps are the lightnesses of a dark developer interface, computed to the
# same relative luminance so the weight of each surface against the next is the
# one that was designed.
bg = "#111111"
surface = "#1b1b1b"
raised = "#262626"
key = "#3d3d3d"          # a key cap, lighter than the surface beneath it
key_edge = "#4b4b4b"     # its edge, half a step lighter again
ink = "#ececec"

# What stands in the status_bar is lighter than the text below it. The bar is
# small and read in passing, so a difference of rank inside it reads as
# unevenness rather than as order. Everything in it carries one tone, and only
# the bars the signal does not reach stand back.
status_ink = "#f0f0f0"
muted = "#939393"
faint = "#757575"

# The accent, and white on it. Measured against the ground it sits on it stands
# at 6.25 to 1, and the label on a button at 3.03 to 1, which is the floor for
# a word set this large. A lighter blue reads better on the ground and carries
# white worse; this is the point where both still hold.
accent = "#009ce9"
accent_ink = "#ffffff"
accent_dim = "#0a5570"

# A hairline between two rows of a list. Three tenths of the way from the
# surface towards the ink, because a line that parts two entries is doing its
# work when one notices the parting rather than the line.
line = "#353535"

# What lies over a dimmed screen. One step lighter than `raised`, because the
# layer beneath pushes everything back and a dialog in the same colour would go
# back with it.
overlay = "#323232"

danger = "#f85149"
danger_ink = "#ffffff"   # the text on the warning colour
